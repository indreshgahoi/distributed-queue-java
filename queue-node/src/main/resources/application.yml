spring:
  application:
    name: queue-node
  main:
    web-application-type: servlet

server:
  port: ${QUEUE_NODE_PORT:8081}

queue:
  node:
    id: ${QUEUE_NODE_ID:local-node-1}
    endpoint: ${QUEUE_NODE_ENDPOINT:http://localhost:8081}
    metadata-base-url: ${METADATA_SERVICE_URL:http://localhost:8080}
    storage-root: ${QUEUE_STORAGE_ROOT:./queue-data}
    registration-lease-duration: ${NODE_REGISTRATION_LEASE_DURATION:PT30S}
    heartbeat-delay: ${NODE_HEARTBEAT_DELAY:PT10S}
    lease-duration: ${PROVISIONING_LEASE_DURATION:PT30S}
    http-connect-timeout: ${QUEUE_NODE_HTTP_CONNECT_TIMEOUT:PT2S}
    http-request-timeout: ${QUEUE_NODE_HTTP_REQUEST_TIMEOUT:PT5S}
    poll-delay: ${PROVISIONING_POLL_DELAY:PT1S}
    runtime-poll-delay: ${RUNTIME_PARTITION_POLL_DELAY:PT1S}
    wal-segment-bytes: ${QUEUE_WAL_SEGMENT_BYTES:16777216}
    max-message-bytes: ${QUEUE_MAX_MESSAGE_BYTES:262144}
    max-retained-messages: ${QUEUE_MAX_RETAINED_MESSAGES:100000}
    max-retained-bytes: ${QUEUE_MAX_RETAINED_BYTES:1073741824}
