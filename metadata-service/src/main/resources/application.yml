spring:
  application:
    name: queue-metadata-service
  datasource:
    url: ${METADATA_DATABASE_URL:jdbc:postgresql://localhost:5432/queue_metadata}
    username: ${METADATA_DATABASE_USER:queue}
    password: ${METADATA_DATABASE_PASSWORD:queue}
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${METADATA_HTTP_PORT:8080}
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
